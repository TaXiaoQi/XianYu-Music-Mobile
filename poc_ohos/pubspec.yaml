name: xianyu_ohos_poc
description: 弦予音乐 鸿蒙原生（HarmonyOS NEXT）可行性 PoC 壳工程
publish_to: "none"
version: 0.1.0

# 故意放宽 Dart 下限：Flutter-OH 3.41 稳定版对应 Dart 3.11，
# 主工程约束 ^3.12.2 需等 Flutter-OH 3.44 Release（路线图 2026-09），
# PoC 阶段先用 3.41-ohos 跑通全链路。
environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 与主工程生成代码（lib/src/rust，@generated by 2.12.0）严格同版本
  flutter_rust_bridge: 2.12.0

  # ---- 鸿蒙适配版插件（ohos 实现由主包内嵌/ endorsed，无需单独引子包）----
  # 注意：同一包名不能同时来自两个 git 源，统一用下方地址与主包传递依赖对齐。
  just_audio:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_just_audio.git
      path: just_audio
  audio_service:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_audio_service.git
      path: audio_service

# audio_session 双源冲突：audio_service 要求 HEAD、just_audio 要求 br_v0.2.2_ohos，
# 统一钉住到 ohos 分支（override 对两者同时生效）
dependency_overrides:
  # path_provider 以 override 形式走鸿蒙源（audio_service 传递链要求 hosted 源，
  # 直接放 dependencies 会触发双源冲突）
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/path_provider/path_provider
  audio_session:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_audio_session.git
      ref: br_v0.2.2_ohos

flutter:
  uses-material-design: true