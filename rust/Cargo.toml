[package]
name = "xianyu_core"
version = "0.1.0"
description = "弦予音乐移动端复用核心（从桌面端抽取的纯逻辑，不依赖 Tauri）"
authors = ["lyc"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "xianyu_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
amll-lyric = "0.3.0"
regex = "1"
sha1 = "0.10"
hex = "0.4"
md5 = "0.7"
urlencoding = "2"
reqwest = { version = "0.12.26", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream"] }
bytes = "1"
tokio = { version = "1.48.0", features = ["sync", "rt-multi-thread", "time", "macros", "fs", "io-util", "net"] }
rustfft = "6.4.1"
base64 = "0.22.1"
rusqlite = { version = "0.38.0", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
encoding_rs = "0.8"
thiserror = "2"
id3 = "1.14"
lofty = "0.21"
flutter_rust_bridge = "=2.12.0"
flate2 = "1"
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
num-bigint = "0.4"
# 兜底模块签名校验（服务端私钥签发 → 客户端内嵌公钥验签）
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
quick-xml = "0.39.2"
rayon = "1.10"
walkdir = "2"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
uuid = { version = "1", features = ["v4"] }
# default-features 必须关掉：默认特性含 avif（ravif→rav1e AV1 编码器）、exr、tiff 等，
# 会让 arm64 .so 白涨约 5-8MB（封面只需 jpeg/png/webp）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rquickjs = { version = "0.12", features = ["futures", "parallel", "bindgen"] }
getrandom = "0.3"
url = "2"
# DLNA 双向投屏（dlna/ 模块，双端同步一份代码）
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
socket2 = "0.6"
# APE/WV 解码（与桌面端 vendor rodio 同源 crate），转码为 WAV 供 ExoPlayer 播放
ape-decoder = "0.3"
wavicle = { version = "0.1", default-features = false, features = ["decode"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[profile.dev]
# 与桌面端保持一致：DSP/FFT 热路径在 opt-level=0 下较慢
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# 直接产出已 strip 的 .so：jniLibs 里的 libxianyu_core.so 从 ~42MB（含 13MB 符号表）降到 ~30MB
strip = "symbols"
# fat LTO + 单 codegen unit：跨 crate 最大化内联去重（比 thin 再省约 1~3MB，编译更慢）
lto = "fat"
codegen-units = 1
# 包体压缩：按体积优先优化（-Oz），并裁掉 unwind 表（panic=abort）
# 体积优先会轻微牺牲少数热路径速度，DSP/FFT 热函数用 #[inline]/#[target_feature] 兜底
opt-level = "z"
panic = "abort"
