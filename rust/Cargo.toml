[package]
name = "xianyu_mobile"
version = "0.1.0"
description = "弦予音乐移动端薄壳（FFI 桥接层），纯逻辑在 submodule rust/core（XianYu-Music-Core）"
authors = ["lyc"]
license = "LicenseRef-XianYu-SAL-1.0"
edition = "2021"

[lib]
# lib 名保持 xianyu_core：产物 libxianyu_core.so 与 FRB/Dart 侧加载名不变
name = "xianyu_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
# api 层自身依赖（复合类型走 JSON 字符串约定）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48.0", features = ["sync", "rt-multi-thread", "time", "macros", "fs", "io-util", "net"] }
flutter_rust_bridge = "=2.12.0"
# 共享纯逻辑核心（git submodule：rust/core → XianYu-Music-Core）
xianyu_core = { path = "core" }

[profile.dev]
# DSP/FFT 热路径在 opt-level=0 下较慢
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# 直接产出已 strip 的 .so：jniLibs 里的 libxianyu_core.so 从 ~42MB（含 13MB 符号表）降到 ~30MB
strip = "symbols"
# fat LTO + 单 codegen unit：跨 crate 最大化内联去重（比 thin 再省约 1~3MB，编译更慢）
lto = "fat"
codegen-units = 1
# 包体压缩：按体积优先优化（-Oz），并裁掉 unwind 表（panic=abort）
# 体积优先会轻微牺牲少数热路径速度，DSP/FFT 热函数用 #[inline]/#[target_feature] 兜底
opt-level = "z"
panic = "abort"
