org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
# Gradle 9.1.0 不支持 Java 25（系统默认 JDK 会选 jdk-25.0.2 导致守护进程配置阶段卡死），
# 显式固定到受支持的 JDK 21。
org.gradle.java.home=D:\\Program Files\\Java\\jdk-21.0.10
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 项目路径含非 ASCII 字符（中文），禁用 Android Gradle 插件路径检查 (b.android.com/95744)
android.overridePathCheck=true
# 跳过 release 关键 lint 检查（避免构建时从 dl.google.com 下载 lint 依赖超时）
android.lintVitalCheck=false
# 沙箱环境无法写 Kotlin daemon 临时目录，改用进程内编译
kotlin.compiler.execution.strategy=in-process
# 禁用 Kotlin 增量编译，规避增量缓存文件写入失败（Could not close incremental caches）
kotlin.incremental=false
# 禁用插件默认 ABI 注入（FlutterPlugin.kt configureAbiWithoutSplits 会 clear 掉
# build.gradle.kts 里的 abiFilters 再写入全部三个 ABI；设为 true 后自定义 arm64-only 生效）
disable-abi-filtering=true
# 裸 `flutter build apk --release` 也启用 Dart 混淆（等价 --obfuscate）。
# flutter 工具每次构建都会无条件传 -Pdart-obfuscation=false（命令行优先级高于属性文件，
# 无法覆盖）；但 extra-gen-snapshot-options 只在显式传 flag 时才被 -P 覆盖，
# 故从 gen_snapshot 参数层注入 --obfuscate 生效。
# --save-debugging-info 把 DWARF 调试信息抽到独立文件（纯文件名 → 落 gen_snapshot
# 进程 CWD，即项目根），--dwarf-stack-traces 改用 DWARF 式堆栈（省掉内嵌符号表，
# 工具原生 --obfuscate 流程同款三件套），否则 libapp.so 膨胀 ~1.2MB
# （--strip 在 Windows 无效）。
# 符号文件 app.symbols 落在项目根，由 app 模块的 archiveReleaseApk 任务自动归档到
# releases/symbols/<版本>/。
extra-gen-snapshot-options=--obfuscate,--dwarf-stack-traces,--save-debugging-info=app.symbols
